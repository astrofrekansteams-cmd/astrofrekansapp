# Release-candidate builds only. Create the named Codemagic groups and signing
# identities outside Git; no automatic App Store or Play publishing is enabled.
workflows:
  android-release-candidate:
    name: Astrofrekans Android release candidate
    max_build_duration: 120
    environment:
      flutter: stable
      android_signing:
        - astrofrekans_upload
      groups:
        - astrofrekans_mobile_release
    scripts:
      - name: Verify release inputs
        script: |
          set -eu
          : "${API_BASE_URL:?Set the production API URL in Codemagic}"
          : "${AUTH_MODE:?Set AUTH_MODE=hybrid (release decision)}"
          : "${TERMS_URL:?Set the published terms URL in Codemagic}"
          : "${FIREBASE_ANDROID_JSON_B64:?Set real Firebase Android config in Codemagic}"
          : "${CM_KEYSTORE_PATH:?Upload Android signing identity astrofrekans_upload}"
          : "${CM_KEYSTORE_PASSWORD:?Missing upload key password}"
          : "${CM_KEY_ALIAS:?Missing upload key alias}"
          : "${CM_KEY_PASSWORD:?Missing upload key password}"
          case "$API_BASE_URL" in https://*) ;; *) echo 'API_BASE_URL must use HTTPS' >&2; exit 1;; esac
          case "$TERMS_URL" in https://*) ;; *) echo 'TERMS_URL must use HTTPS' >&2; exit 1;; esac
          # Production is hybrid: Firebase accounts and server (local JWT) accounts.
          [ "$AUTH_MODE" = hybrid ] || { echo 'Production AUTH_MODE must be hybrid' >&2; exit 1; }
      - name: Verify published legal and reset pages
        script: |
          set -eu
          for url in "$TERMS_URL" \
            https://astrofrekansteams-cmd.github.io/astrofrekansapp/ \
            https://astrofrekansteams-cmd.github.io/astrofrekansapp/support.html \
            https://astrofrekansteams-cmd.github.io/astrofrekansapp/delete-account.html \
            https://astrofrekansteams-cmd.github.io/astrofrekansapp/reset-password.html; do
            curl --fail --silent --show-error --location --max-time 15 --output /dev/null "$url"
          done
      - name: Fetch image assets
        script: |
          git lfs install --skip-smudge
          git lfs pull
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Inject real Android Firebase config
        script: |
          set -eu
          printf '%s' "$FIREBASE_ANDROID_JSON_B64" | base64 --decode > android/app/google-services.json
          # Production project, this package, app id of that project.
          dart run tool/validate_firebase_config.dart --production android/app/google-services.json
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Android native JUnit tests
        script: |
          cd android
          ./gradlew :app:testDebugUnitTest
      - name: Build signed Android App Bundle
        script: |
          flutter build appbundle --release \
            --dart-define=APP_ENVIRONMENT=production \
            --dart-define=APP_DATA_SOURCE=api \
            --dart-define=AUTH_MODE="$AUTH_MODE" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=TERMS_URL="$TERMS_URL" \
            --dart-define=ENABLE_DEBUG_TOOLS=false \
            --dart-define=ENABLE_APPLE_SIGN_IN="${ENABLE_APPLE_SIGN_IN:-false}"
      - name: Verify the bundle is signed with the upload key
        script: |
          set -eu
          # Never the Android debug certificate; always the upload key.
          CERT="$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab)"
          if printf '%s' "$CERT" | grep -q 'CN=Android Debug'; then
            echo 'Release bundle is signed with the debug key' >&2; exit 1
          fi
          printf '%s\n' "$CERT" | grep -E 'Owner:|SHA256:' | head -2
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  ios-release-candidate:
    name: Astrofrekans iOS release candidate
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.astrofrekans.astrofrekans
      groups:
        - astrofrekans_mobile_release
    scripts:
      - name: Verify release inputs
        script: |
          set -eu
          : "${API_BASE_URL:?Set the production API URL in Codemagic}"
          : "${AUTH_MODE:?Set AUTH_MODE=hybrid (release decision)}"
          : "${TERMS_URL:?Set the published terms URL in Codemagic}"
          : "${FIREBASE_IOS_PLIST_B64:?Set real Firebase iOS config in Codemagic}"
          case "$API_BASE_URL" in https://*) ;; *) echo 'API_BASE_URL must use HTTPS' >&2; exit 1;; esac
          case "$TERMS_URL" in https://*) ;; *) echo 'TERMS_URL must use HTTPS' >&2; exit 1;; esac
          # Production is hybrid: Firebase accounts and server (local JWT) accounts.
          [ "$AUTH_MODE" = hybrid ] || { echo 'Production AUTH_MODE must be hybrid' >&2; exit 1; }
      - name: Verify published legal and reset pages
        script: |
          set -eu
          for url in "$TERMS_URL" \
            https://astrofrekansteams-cmd.github.io/astrofrekansapp/ \
            https://astrofrekansteams-cmd.github.io/astrofrekansapp/support.html \
            https://astrofrekansteams-cmd.github.io/astrofrekansapp/delete-account.html \
            https://astrofrekansteams-cmd.github.io/astrofrekansapp/reset-password.html; do
            curl --fail --silent --show-error --location --max-time 15 --output /dev/null "$url"
          done
      - name: Fetch image assets
        script: |
          git lfs install --skip-smudge
          git lfs pull
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Inject real iOS Firebase config
        script: |
          set -eu
          printf '%s' "$FIREBASE_IOS_PLIST_B64" | base64 -D > ios/Runner/GoogleService-Info.plist
          # Production project, this bundle id, app id of that project (same
          # rule as the Android Gradle check and the backend).
          dart run tool/validate_firebase_config.dart --production ios/Runner/GoogleService-Info.plist
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: iOS Runner XCTest on available simulator
        script: |
          set -eu
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone") and d.get("isAvailable", True)), ""))')"
          : "${SIMULATOR_ID:?No available iPhone simulator for RunnerTests}"
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO
      - name: Configure iOS signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=APP_ENVIRONMENT=production \
            --dart-define=APP_DATA_SOURCE=api \
            --dart-define=AUTH_MODE="$AUTH_MODE" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=TERMS_URL="$TERMS_URL" \
            --dart-define=ENABLE_DEBUG_TOOLS=false \
            --dart-define=ENABLE_APPLE_SIGN_IN="${ENABLE_APPLE_SIGN_IN:-false}"
    artifacts:
      - build/ios/ipa/*.ipa
